{{- /*
  Fix for CAPHCP v1.7.2 NetworkPolicy bug — the CAPHCP-managed coredns
  NetworkPolicy in the workload cluster only allows ingress on TCP:53,
  which drops all UDP:53 DNS queries (the default protocol for glibc
  resolvers). Every workload pod that tries to resolve any hostname
  hangs and times out. konnectivity-agent is the loudest victim — it
  never resolves its proxy-server-host FQDN, never establishes the
  gRPC session, and its /readyz stays 503 → CrashLoopBackOff → the
  cluster is technically Ready but functionally unreachable.
  We ship an ADDITIVE NetworkPolicy allowing UDP:53 ingress to CoreDNS
  from any pod in the workload cluster. Kubernetes NetworkPolicies are
  OR-combined, so this does not need to touch the CAPHCP-managed one.
  Only rendered in HCP mode — vanilla kubeadm clusters do not carry
  the CAPHCP coredns NetworkPolicy and never need this fix.
*/ -}}
{{- if eq .Values.cni.hostedControlPlane.enabled true -}}
---
apiVersion: addons.stackhpc.com/v1alpha1
kind: Manifests
metadata:
  name: {{ include "cluster-addons.componentName" (list . "coredns-udp-ingress-fix") }}
  labels: {{ include "cluster-addons.componentLabels" (list . "coredns-udp-ingress-fix") | nindent 4 }}
spec:
  clusterName: {{ include "cluster-addons.clusterName" . }}
  bootstrap: true
  targetNamespace: kube-system
  releaseName: coredns-udp-ingress-fix
  manifestSources:
    - template: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: coredns-udp-ingress-fix
          namespace: kube-system
          labels:
            capi.stackhpc.com/workaround: caphcp-v1.7.2-coredns-np-udp53
        spec:
          policyTypes: [Ingress]
          podSelector:
            matchLabels:
              k8s-app: kube-dns
          ingress:
          - from:
            - namespaceSelector: {}
              podSelector: {}
            ports:
            - port: 53
              protocol: UDP
{{- end }}
