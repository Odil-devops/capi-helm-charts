{{- if and .Values.openstack.enabled .Values.openstack.ccm.enabled (not .Values.openstack.ccm.hosted) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-addons.componentName" (list . "ccm-openstack") }}-config
  labels:
    {{- include "cluster-addons.componentLabels" (list . "ccm-openstack") | nindent 4 }}
    addons.stackhpc.com/watch: ""
stringData:
  defaults: |
    secret:
      create: false
    cluster:
      name: {{ include "cluster-addons.clusterName" . }}
    controllerExtraArgs: |-
      - --use-service-account-credentials=false
    {{- if .Values.openstack.controlPlaneOnly }}
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    {{- end }}
    tolerations:
      - key: node.cloudprovider.kubernetes.io/uninitialized
        value: "true"
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      # CAPI marks new nodes with this taint until the infra provider clears it.
      # Without tolerating it, the CCM DaemonSet can't schedule on a fresh node —
      # and the CCM is precisely what clears the sibling
      # `node.cloudprovider.kubernetes.io/uninitialized` taint. Chicken-and-egg
      # deadlock: the node stays uninitialized forever.
      - key: node.cluster.x-k8s.io/uninitialized
        effect: NoSchedule
      # Also tolerate not-ready so the CCM can come up before the CNI does —
      # otherwise nothing ever transitions the node to Ready in the first place.
      - key: node.kubernetes.io/not-ready
        effect: NoSchedule
    {{- if .Values.reloader.enabled }}
    commonAnnotations:
      secret.reloader.stakater.com/reload: cloud-config
    {{- end }}
  overrides: |
    {{- toYaml .Values.openstack.ccm.values | nindent 4 }}
---
apiVersion: addons.stackhpc.com/v1alpha1
kind: HelmRelease
metadata:
  name: {{ include "cluster-addons.componentName" (list . "ccm-openstack") }}
  labels: {{ include "cluster-addons.componentLabels" (list . "ccm-openstack") | nindent 4 }}
spec:
  clusterName: {{ include "cluster-addons.clusterName" . }}
  bootstrap: true
  chart: {{ toYaml .Values.openstack.ccm.chart | nindent 4 }}
  targetNamespace: {{ .Values.openstack.targetNamespace }}
  releaseName: ccm-openstack
  valuesSources:
    - secret:
        name: {{ include "cluster-addons.componentName" (list . "ccm-openstack") }}-config
        key: defaults
    - secret:
        name: {{ include "cluster-addons.componentName" (list . "ccm-openstack") }}-config
        key: overrides
{{- end }}
