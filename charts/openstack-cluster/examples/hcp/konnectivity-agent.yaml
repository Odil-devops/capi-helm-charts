---
# konnectivity-agent DaemonSet — deploys the agent side of the apiserver-to-node
# reverse tunnel on every worker in the tenant cluster. Required when the
# apiserver runs off-cluster (HCP mode) and needs to reach kubelet for
# `kubectl logs / exec / port-forward` and admission webhooks.
#
# Replace KONNECTIVITY_HOST with the FQDN advertised by the CAPHCP-managed
# TLSRoute — typically `konnectivity.<cluster>.<hcp-namespace>.<wildcard>`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: konnectivity-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:konnectivity-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: konnectivity-agent
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: konnectivity-agent
  namespace: kube-system
  labels:
    k8s-app: konnectivity-agent
spec:
  selector:
    matchLabels:
      k8s-app: konnectivity-agent
  template:
    metadata:
      labels:
        k8s-app: konnectivity-agent
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: konnectivity-agent
      tolerations:
        - operator: Exists
      hostNetwork: true
      containers:
        - name: konnectivity-agent
          image: registry.k8s.io/kas-network-proxy/proxy-agent:v0.32.0
          args:
            - --logtostderr=true
            - --ca-cert=/etc/konnectivity/ca.crt
            - --proxy-server-host=KONNECTIVITY_HOST
            - --proxy-server-port=443
            - --sync-forever=true
            - --agent-identifiers=host=$(HOST_IP)
            # HCP-mode: konnectivity-server authenticates the agent by a
            # projected ServiceAccount token (audience matches the
            # apiserver's --authentication-audience flag). No client cert.
            - --service-account-token-path=/var/run/secrets/tokens/konnectivity-agent-token
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 50m
              memory: 30Mi
          volumeMounts:
            - name: konnectivity-ca
              mountPath: /etc/konnectivity
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          livenessProbe:
            httpGet:
              scheme: HTTP
              port: 8093
              path: /healthz
            initialDelaySeconds: 15
            timeoutSeconds: 15
      volumes:
        - name: konnectivity-ca
          secret:
            secretName: konnectivity-agent-certs
            items:
              - key: ca.crt
                path: ca.crt
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: konnectivity-agent-token
                  audience: system:konnectivity-server
                  expirationSeconds: 3600
